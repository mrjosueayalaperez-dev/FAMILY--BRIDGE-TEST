function guidedHome(){return `<p>${tr('For the family waiting on the outside. One step at a time.','Para la familia que espera afuera. Un paso a la vez.')}</p><h2>${tr('What is happening right now?','¿Qué está pasando ahora?')}</h2><div class="warn">${L[lang].notLawyer}</div>${[
['first48','Someone was just taken','Se acaban de llevar a alguien'],['locate','I cannot find them','No logro encontrarle'],['facility','I found the facility','Ya encontré el centro'],['hearing','There is a court date or bond question','Hay una fecha de corte o una pregunta sobre fianza'],['after','They were released or removed','Le liberaron o le deportaron']].map(([v,en,es],i)=>`<button class="big" onclick="guideStart('${v}')"><span class="ic" aria-hidden="true">${i+1}</span><span>${tr(en,es)}</span></button>`).join('')}<h3>${tr('Other ways to get help','Otras formas de recibir ayuda')}</h3><p><button class="btn" onclick="go('speak')">🎤 ${L[lang].speak}</button><button class="btn" onclick="go('type')">⌨ ${L[lang].type}</button><button class="btn" onclick="go('docs')">${L[lang].docs}</button><button class="btn" onclick="go('support')">${L[lang].sup}</button><button class="btn" onclick="guideStart('familyPlan')">${tr('Family plan','Plan familiar')}</button></p><p>${tr('Free. No account. Guided public information, not a live AI or detention database.','Gratis. Sin cuenta. Orientación con información pública; no es una IA en vivo ni una base de datos de detenidos.')}</p>`;}
function checklist(items){return items.map(([en,es])=>`<label class="guideCheck"><input type="checkbox"> <span>${tr(en,es)}</span></label>`).join('');}
function lookupView(){
 if(!custody)return guideShell(tr('Who might be holding them?','¿Qué agencia podría tenerle?'),`<p>${tr('Choose what you know. A county jail can also hold people for ICE; the building and the custody agency may be different.','Elija lo que sabe. Una cárcel del condado también puede alojar a personas bajo custodia de ICE; el edificio y la agencia pueden ser distintos.')}</p>${[['ice','ICE or CBP (immigration)','ICE o CBP (inmigración)'],['county','County or city jail','Cárcel del condado o municipal'],['state','State prison','Prisión estatal'],['federal','Federal custody / BOP','Custodia federal / BOP'],['child','A child under 18','Una persona menor de 18 años'],['unknown','I do not know','No sé']].map(([k,en,es])=>`<button class="big alt" data-custody="${k}">${tr(en,es)}</button>`).join('')}`,['nilc','ice']);
 if(custody==='child')return guideShell(tr('Looking for a child','Buscar a un menor'),`<p>${tr('Children under 18 do not appear in the ICE online locator. This does not tell you which agency has the child.','Los menores de 18 años no aparecen en el localizador de ICE. Eso no indica qué agencia tiene al menor.')}</p><p>${tr('If you are a parent or guardian and believe the child may be in HHS / ORR care, use the ORR National Call Center. ORR is not the route for every detained child.','Si es padre, madre o tutor y cree que el menor podría estar al cuidado de HHS / ORR, contacte al centro de llamadas de ORR. ORR no es la vía para todos los menores detenidos.')}</p><a class="btn p" href="tel:+18002037001">${tr('Call ORR','Llamar a ORR')} · 1-800-203-7001</a><p>${tr('Do not enter a child’s name or documents here. If the agency is unclear, seek qualified legal help.','No ingrese aquí nombres ni documentos de menores. Si no sabe la agencia, busque ayuda legal calificada.')}</p><button class="btn" onclick="go('legal')">${tr('Find legal aid','Buscar ayuda legal')}</button><button class="btn" data-restart>${tr('Choose another custody type','Elegir otra custodia')}</button>`,['ice','child','nilc']);
 if(custody==='unknown')return guideShell(tr('It is okay not to know yet','Está bien no saber todavía'),`<ol><li>${tr('On paper, note when and where they were last seen and which agency made the arrest, if known. Do not put personal details in this page.','Anote en papel cuándo y dónde se le vio por última vez y qué agencia hizo el arresto, si lo sabe. No escriba datos personales en esta página.')}</li><li>${tr('If immigration officers were involved, try the ICE route. For a local arrest, contact the official county jail or arresting agency. Federal criminal custody may require the BOP route or a federal defender.','Si participaron agentes de inmigración, pruebe la vía de ICE. Para un arresto local, contacte la cárcel oficial del condado o la agencia que arrestó. La custodia penal federal puede requerir BOP o un defensor federal.')}</li><li>${tr('A missing online result does not prove release or absence from custody.','Que no aparezca en línea no demuestra que esté libre o fuera de custodia.')}</li></ol><button class="btn p" data-custody="ice">${tr('Try ICE guidance','Ver orientación para ICE')}</button><button class="btn" data-restart>${tr('Review the options','Revisar opciones')}</button><button class="btn" onclick="go('legal')">${tr('Find legal aid','Buscar ayuda legal')}</button>`,['nilc']);
 if(!lookupMethod)return guideShell(tr('Do you have their number?','¿Tiene su número?'),`<p>${tr('Choose a number or continue without one. No number is required to get guidance.','Puede usar un número o seguir sin él. No se requiere un número para recibir orientación.')}</p><button class="big" data-method="number">${custody==='ice'?tr('I have an A-number','Tengo un número A'):tr('I have an inmate / booking number','Tengo un número de recluso / registro')}</button><button class="big alt" data-method="name">${tr('I do not have the number — use name guidance','No tengo el número — orientación por nombre')}</button><button class="btn" data-restart>${tr('Change custody type','Cambiar tipo de custodia')}</button>`,custody==='ice'?['ice']:custody==='federal'?['bop']:['nilc']);
 const ice=custody==='ice',federal=custody==='federal';
 const label=ice?tr('A-number (optional)','Número A (opcional)'):tr('Inmate / booking number (optional)','Número de recluso / registro (opcional)');
 const fields=lookupMethod==='number'?`<label for="lookupNumber">${label}</label><input class="guideInput" type="text" id="lookupNumber" maxlength="40" autocomplete="off" spellcheck="false" ${ice?'inputmode="numeric"':''}><p>${ice?tr('ICE requires nine digits, padding a shorter number with leading zeros, plus country of birth. Do not use a county booking number as an A-number.','ICE requiere nueve dígitos, completando un número corto con ceros al inicio, y el país de nacimiento. No use el registro del condado como número A.'):federal?tr('BOP register numbers use five digits, a hyphen, then three digits. Other identifiers may be supported on the official form.','El registro BOP tiene cinco dígitos, un guion y tres dígitos. El formulario oficial puede aceptar otros identificadores.'):tr('Formats differ by jail or state. Enter it exactly as shown on the official paperwork.','El formato cambia según la cárcel o el estado. Escríbalo tal como aparece en el documento oficial.')}</p>`:`<p>${ice?tr('Have the first and last names exactly as recorded, and country of birth, ready for the official locator. Date of birth can help narrow the search. Do not enter the name here.','Tenga listos los nombres y apellidos tal como figuran en el registro, y el país de nacimiento, para el localizador oficial. La fecha de nacimiento puede ayudar. No escriba el nombre aquí.'):tr('Have the full name ready for the official jail or prison search. This guide does not collect the name.','Tenga el nombre completo para la búsqueda oficial de la cárcel o prisión. Esta guía no recoge el nombre.')}</p>`;
 const extra=ice?`<label for="lookupPlace">${tr('Country of birth — optional preparation only','País de nacimiento — preparación opcional')}</label>`:federal?'':`<label for="lookupPlace">${tr('County and state / facility, if known','Condado y estado / centro, si lo sabe')}</label>`;
 const dest=ice?'https://locator.ice.gov/':federal?'https://www.bop.gov/inmateloc/':'';
 return guideShell(tr('Prepare for the official lookup','Prepárese para la búsqueda oficial'),`<div class="warn">${tr('Preparation only — Family Bridge cannot search detention records. Fields stay in this open page, are not sent or saved, and clear when you leave this step or change language. Enter details again on the official site.','Solo preparación — Family Bridge no consulta registros de detención. Los campos permanecen en esta página abierta; no se envían ni guardan y se borran al salir de este paso o cambiar el idioma. Ingrese los datos de nuevo en el sitio oficial.')}</div><form id="lookupPrep" autocomplete="off">${fields}${extra}${extra?'<input class="guideInput" type="text" id="lookupPlace" maxlength="100" autocomplete="off">':''}<button class="btn" type="submit">${tr('Check preparation','Revisar preparación')}</button></form><p id="lookupStatus" role="status"></p>${dest?`<a class="btn p" href="${dest}" target="_blank" rel="noopener noreferrer">${ice?tr('Open official ICE locator','Abrir localizador oficial de ICE'):tr('Open official BOP locator','Abrir localizador oficial de BOP')} ↗</a>`:`<p>${tr('Use the county sheriff / jail’s official website for local custody, or the state Department of Corrections for state prison. There is no single nationwide county or state inmate number. Ask the arresting agency for the official lookup if unsure.','Use el sitio oficial del sheriff / cárcel para custodia local, o del Departamento de Correcciones estatal para prisión estatal. No existe un solo número nacional de recluso para todos los condados o estados. Si duda, pida la búsqueda oficial a la agencia que arrestó.')}</p>`}<button class="btn" data-restart>${tr('Start over and clear fields','Empezar de nuevo y borrar campos')}</button>${ice?`<div class="warn">${tr('Scam check: the official ICE locator is free at locator.ice.gov. No result may mean delayed processing or missing records; it does not establish that the person is free.','Evite estafas: el localizador oficial de ICE es gratis en locator.ice.gov. Sin resultado puede haber demora o registros ausentes; eso no demuestra que la persona esté libre.')}</div><a class="btn" href="tel:+18883514024">${tr('Call ICE detention information','Llamar a información de detención de ICE')} · 1-888-351-4024</a><p>${tr('Live operators: weekdays, excluding holidays, 8 a.m.–8 p.m. Eastern; language assistance available.','Operadores: lunes a viernes, excepto festivos, de 8 a. m. a 8 p. m. hora del Este; hay asistencia de idiomas.')}</p>`:''}`,ice?['ice','nilc']:federal?['bop','nilc']:['nilc']);
}
function guidedView(){
 if(view==='locate')return lookupView();
 if(view==='first48')return guideShell(tr('The first steps — one at a time','Los primeros pasos — uno a la vez'),`<p>${tr('Use this checklist while you contact official sources. Nothing checked here is saved.','Use esta lista mientras contacta fuentes oficiales. Las marcas no se guardan.')}</p>${checklist([['On paper, gather full name, date and country of birth, any A-number, and last known location.','Reúna en papel el nombre completo, fecha y país de nacimiento, número A si existe y último lugar conocido.'],['Check which agency has custody; do not assume a county jail means county custody.','Confirme qué agencia tiene la custodia; una cárcel del condado no implica siempre custodia del condado.'],['Keep a paper timeline of calls, dates, staff names and what was said.','Lleve en papel un registro de llamadas, fechas, nombres del personal y lo informado.'],['Check who can care for children, manage medicines and contact a qualified legal representative.','Revise quién puede cuidar a los niños, atender medicamentos y contactar ayuda legal calificada.']])}<button class="btn p" onclick="guideStart('locate')">${tr('Help me look for them','Ayúdeme a buscarle')}</button><p>${tr('ICE records may take more than a day to appear; some people are not listed. Do not wait to seek legal help. Minors are not shown in the ICE locator.','Los registros de ICE pueden tardar más de un día; algunas personas no aparecen. No espere para buscar ayuda legal. Los menores no aparecen en el localizador de ICE.')}</p><button class="btn" onclick="go('legal')">${tr('Find legal aid','Buscar ayuda legal')}</button>`,['nilc','ice','ilrc']);
 if(view==='facility')return guideShell(tr('You found a facility — now confirm the details','Encontró un centro — confirme los detalles'),`<p>${tr('Confirm the current facility before travel, mail or any payment. Rules differ and people can be transferred.','Confirme el centro actual antes de viajar, enviar correspondencia o pagar. Las reglas varían y pueden trasladar a la persona.')}</p><ol><li>${tr('Open the agency’s official facility page and call its listed number.','Abra la página oficial del centro y llame al número que allí figura.')}</li><li>${tr('Ask about visiting appointments, accepted identification, phone accounts, mail rules, and how to request medical attention.','Pregunte por citas de visita, identificación aceptada, cuentas telefónicas, reglas de correo y cómo solicitar atención médica.')}</li><li>${tr('Verify the approved payment provider directly with the facility. Do not send money based on an unsolicited message.','Verifique el proveedor de pagos con el centro. No envíe dinero por un mensaje no solicitado.')}</li></ol><a class="btn p" href="https://www.ice.gov/detain" target="_blank" rel="noopener noreferrer">${tr('ICE — open Detention Facilities','ICE — abrir Detention Facilities')} ↗</a><button class="btn" onclick="go('legal')">${tr('Find legal aid','Buscar ayuda legal')}</button>`,['fac','nilc']);
 if(view==='hearing')return guideShell(tr('A court date or a bond question','Una fecha de corte o pregunta de fianza'),`<p>${tr('Check the written hearing notice first. Court documents are the official source; online case information may be incomplete.','Revise primero el aviso escrito de audiencia. Los documentos de la corte son la fuente oficial; la información en línea puede estar incompleta.')}</p><a class="btn p" href="https://acis.eoir.justice.gov/en/" target="_blank" rel="noopener noreferrer">${tr('Open EOIR case information','Abrir información de casos EOIR')} ↗</a><a class="btn" href="tel:+18008987180">${tr('Call EOIR','Llamar a EOIR')} · 1-800-898-7180</a><p>${tr('Have the A-number ready for the official system. For a date you cannot confirm or a bond question, contact the court and a licensed attorney or accredited representative. This app cannot determine bond eligibility, filing deadlines or legal strategy.','Tenga el número A para el sistema oficial. Si no logra confirmar una fecha o tiene dudas de fianza, contacte a la corte y a un abogado con licencia o representante acreditado. Esta app no determina elegibilidad de fianza, plazos ni estrategia legal.')}</p><button class="btn" onclick="go('legal')">${tr('Find legal aid','Buscar ayuda legal')}</button>`,['court']);
 if(view==='after')return guideShell(tr('After release or removal','Después de la liberación o deportación'),`<p>${tr('Keep release paperwork and court notices together. Ask qualified legal help which appointments or obligations still apply; this guide cannot decide that from a release status.','Reúna los documentos de liberación y avisos de corte. Pregunte a ayuda legal calificada qué citas u obligaciones siguen vigentes; esta guía no puede decidirlo por un estado de liberación.')}</p><button class="btn p" onclick="guideStart('familyPlan')">${tr('Make a family checklist','Preparar una lista familiar')}</button><button class="btn" onclick="go('support')">${tr('Family and community resources','Recursos para familia y comunidad')}</button><button class="btn" onclick="go('legal')">${tr('Find legal aid','Buscar ayuda legal')}</button><p>${tr('If someone fears their home government or seeks asylum, get legal advice before contacting their consulate.','Si la persona teme a su gobierno o solicita asilo, busque asesoría legal antes de contactar al consulado.')}</p>`,['nilc','ilrc']);
 if(view==='familyPlan')return guideShell(tr('The family at home','La familia en casa'),`<p>${tr('Use paper or the official ILRC plan. Do not enter children’s information, medical details or document photos here. Checkmarks below last only until this screen is rebuilt.','Use papel o el plan oficial de ILRC. No ingrese aquí datos de menores, información médica ni fotos de documentos. Las marcas duran solo hasta que se reconstruye esta pantalla.')}</p>${checklist([['Identify a trusted backup caregiver and how to reach them.','Identifique un cuidador de confianza y cómo contactarle.'],['Keep school pickup arrangements and emergency contacts available.','Tenga disponibles los acuerdos de recogida escolar y contactos de emergencia.'],['Keep medicine instructions and doctor contacts in a safe place.','Guarde instrucciones de medicamentos y contactos médicos en un lugar seguro.'],['Know where important documents are kept and who is authorized to access them.','Sepa dónde están los documentos importantes y quién tiene autorización para acceder.']])}<a class="btn p" href="${GS.ilrc[1]}" target="_blank" rel="noopener noreferrer">${tr('Open the bilingual ILRC family plan','Abrir el plan familiar bilingüe de ILRC')} ↗</a>`,['ilrc']);
 return null;
}
function bindGuidance(){
 document.querySelectorAll('[data-custody]').forEach(b=>b.onclick=()=>{custody=b.dataset.custody;lookupMethod='';render();});
 document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{lookupMethod=b.dataset.method;render();});
 document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{stopReply();custody='';lookupMethod='';render();});
 const read=$('#guideRead');if(read)read.onclick=()=>{const body=$('#guideBody');readReply(`${$('#guideTitle').textContent}. ${L[lang].notLawyer} ${body.innerText}. ${tr('Sources checked','Fuentes consultadas')} ${GUIDE_DATE}. ${$('.guideSources').innerText}`);};
 const stop=$('#guideStop');if(stop)stop.onclick=stopReply;
 const f=$('#lookupPrep');if(f)f.onsubmit=ev=>{ev.preventDefault();const n=$('#lookupNumber'),v=n?n.value.trim():'';let msg;
 if(custody==='ice'&&v&&!/^A?[\s-]*\d(?:[\s-]*\d){6,8}$/i.test(v))msg=tr('Check the A-number: use 7–9 digits, optionally starting with A. ICE’s official form uses nine digits, with leading zeros if needed.','Revise el número A: use 7–9 dígitos, con A inicial opcional. El formulario de ICE usa nueve dígitos, completando con ceros si hace falta.');
 else if(n&&!v)msg=tr('No number entered. You may continue by name on the official site. No lookup has been performed here.','No ingresó número. Puede continuar por nombre en el sitio oficial. Aquí no se ha realizado ninguna búsqueda.');
 else msg=tr('Preparation checked. No records were searched and nothing was sent. Open the official site and enter the information there.','Preparación revisada. No se consultaron registros ni se envió nada. Abra el sitio oficial e ingrese los datos allí.');
 $('#lookupStatus').textContent=msg;};
}
// Route locate questions into guidance without recording personal details in the chat log.
const originalAsk=ask;
function isLocateQuestion(q){const n=norm(q);return /encarcel|detenid|reclus|carcel|prision|inmate|detain|detention|prison|jail|custodia|custody|numero\s*(de\s*)?a\b|a[ -]?number|no (lo|la|le) encuentro|buscar.*persona|find.*person|locate.*person/.test(n)&&!/(abogad|lawyer|attorney|ayuda legal|legal aid)/.test(n);}
function questionRoute(q){const n=norm(q);if(/crisis|suicid|quiero morir|want to die|no puedo mas/.test(n))return '';if(/abogad|lawyer|attorney|ayuda legal|legal aid/.test(n))return '';if(/audiencia|fecha.*corte|cita.*corte|hearing|court date|fianza|bond/.test(n))return 'hearing';if(/visitar|visita|visit|llamar|llamada|phone call|call.*(him|her|them)|send money|enviar dinero/.test(n))return 'facility';if(isLocateQuestion(q))return 'locate';if(/cuidar.*(hij|nin)|childcare|caregiver|plan familiar/.test(n))return 'familyPlan';return '';}
ask=function(q){const route=questionRoute(q);if(route){guideStart(route);if(readAnswers)readReply($('#guideTitle').textContent+'. '+$('#guideBody').innerText);return;}originalAsk(q);};

$("#tv").onclick=()=>go("team");
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("#pv").onclick=()=>go("priv");
setLang(/^es/i.test(navigator.language||"")?"es":"en");
</script></body></html>
